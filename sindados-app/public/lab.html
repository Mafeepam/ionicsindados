<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SINDADOS-BA — iOS e Android lado a lado</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      --azul: #11558f;
      --borda: #d7dde3;
      --fundo: #eef1f4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--fundo);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1b2733;
    }

    header {
      background: var(--azul);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header img { width: 30px; height: auto; }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; }
    header span { font-size: 13px; opacity: 0.8; margin-left: auto; }

    .palco {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      padding: 28px 20px 40px;
    }

    .dispositivo { text-align: center; }

    .dispositivo h2 {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #5a6b7c;
      margin: 0 0 12px;
    }

    .moldura {
      background: #1b2733;
      padding: 12px;
      border-radius: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    }

    .moldura.android { border-radius: 20px; }

    iframe {
      display: block;
      width: 390px;
      height: 780px;
      border: 0;
      border-radius: 26px;
      background: #fff;
    }

    .moldura.android iframe { border-radius: 10px; }

    footer {
      text-align: center;
      font-size: 13px;
      color: #5a6b7c;
      padding: 0 20px 32px;
      line-height: 1.5;
    }

    button {
      font: inherit;
      font-size: 13px;
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--borda);
      background: #fff;
      color: #1b2733;
      cursor: pointer;
    }

    button:hover { background: #f4f6f8; }

    @media (max-width: 900px) {
      iframe { width: 320px; height: 640px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/logo-sindados.png" alt="Logo do SINDADOS-BA">
    <h1>SINDADOS-BA — App do Associado</h1>
    <span>iOS e Android lado a lado</span>
  </header>

  <div class="palco">
    <div class="dispositivo">
      <h2>iOS</h2>
      <div class="moldura">
        <iframe id="ios" src="/?ionic:mode=ios" title="App no modo iOS"></iframe>
      </div>
    </div>

    <div class="dispositivo">
      <h2>Android</h2>
      <div class="moldura android">
        <iframe id="android" src="/?ionic:mode=md" title="App no modo Android"></iframe>
      </div>
    </div>
  </div>

  <footer>
    <p>
      <button onclick="recarregar()">Reiniciar os dois</button>
    </p>
    <p>
      Cada painel é o mesmo aplicativo, renderizado com o visual nativo de sua
      plataforma. Credencial de teste:
      <strong>associado&#64;sindados.org.br</strong> / <strong>123456</strong>
    </p>
  </footer>

  <script>
    function recarregar() {
      document.getElementById('ios').src = '/?ionic:mode=ios';
      document.getElementById('android').src = '/?ionic:mode=md';
    }
  </script>
</body>
</html>
